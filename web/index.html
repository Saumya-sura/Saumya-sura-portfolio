  <script>
    (function() {
      let audioCtx = null;
      window.portfolioMuted = false;

      function getContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      window.playPortfolioSound = function(type) {
        if (window.portfolioMuted) return;
        const ctx = getContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          // Soft mechanical tap
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === 'pop') {
          // Dynamic Island bubble pop
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'chime') {
          // Harmonic palette change chime
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.06);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'key') {
          // Terminal keyboard click
          osc.type = 'square';
          osc.frequency.setValueAtTime(850, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.02);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);
          osc.start(now);
          osc.stop(now + 0.02);
        } else if (type === 'success') {
          // Ascending major arpeggio
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, now + i * 0.05);
            g.gain.setValueAtTime(0.05, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.12);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(now + i * 0.05);
            o.stop(now + i * 0.05 + 0.12);
          });
        }
      };

      window.setPortfolioMuted = function(isMuted) {
        window.portfolioMuted = isMuted;
      };
    })();
  </script>
